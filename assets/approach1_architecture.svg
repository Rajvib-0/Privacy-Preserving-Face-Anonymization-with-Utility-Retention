<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660">
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#111827;stroke-width:2.2;rx:16}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;rx:16}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.2;rx:16}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2.2;rx:16}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2.2;rx:16}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#111827}.label{font:700 20px Arial,Helvetica,sans-serif;fill:#111827}.small{font:400 15px Arial,Helvetica,sans-serif;fill:#374151}.mono{font:700 15px Consolas,monospace;fill:#111827}.arrow{stroke:#111827;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#111827"/></marker>
  </defs>
  <rect class="bg" width="1400" height="660"/>
  <text class="title" x="700" y="58" text-anchor="middle">Approach 1 Architecture: Sinusoidal Perturbation + ArcFace/ResNet</text>
  <rect class="box" x="60" y="235" width="170" height="105"/>
  <text class="label" x="145" y="274" text-anchor="middle">Input I</text>
  <text class="small" x="145" y="304" text-anchor="middle">CelebA face</text>
  <rect class="blue" x="300" y="175" width="245" height="225"/>
  <text class="label" x="422" y="214" text-anchor="middle">Sinusoidal Init</text>
  <text class="small" x="422" y="248" text-anchor="middle">radial bands</text>
  <text class="mono" x="422" y="276" text-anchor="middle">freq = 1,2,4,8</text>
  <text class="small" x="422" y="306" text-anchor="middle">smooth starting P</text>
  <text class="small" x="422" y="334" text-anchor="middle">optimized by Adam</text>
  <text class="mono" x="422" y="363" text-anchor="middle">A = clip(I + eps P)</text>
  <rect class="rose" x="630" y="120" width="280" height="145"/>
  <text class="label" x="770" y="160" text-anchor="middle">Privacy Loss</text>
  <text class="small" x="770" y="193" text-anchor="middle">ArcFace first, then ensemble</text>
  <text class="mono" x="770" y="222" text-anchor="middle">capped softplus(cos)</text>
  <text class="small" x="770" y="247" text-anchor="middle">stop pushing after target</text>
  <rect class="green" x="630" y="330" width="280" height="145"/>
  <text class="label" x="770" y="370" text-anchor="middle">Utility Loss</text>
  <text class="small" x="770" y="403" text-anchor="middle">perceptual similarity</text>
  <text class="mono" x="770" y="432" text-anchor="middle">LPIPS + small MSE</text>
  <text class="small" x="770" y="457" text-anchor="middle">preserve visual quality</text>
  <rect class="purple" x="1000" y="205" width="310" height="165"/>
  <text class="label" x="1155" y="245" text-anchor="middle">Evaluation</text>
  <text class="small" x="1155" y="278" text-anchor="middle">white-box: ArcFace, ResNet</text>
  <text class="small" x="1155" y="306" text-anchor="middle">black-box: VGGFace, CosFace</text>
  <text class="mono" x="1155" y="336" text-anchor="middle">cosine should go below 0</text>
  <path class="arrow" d="M230 287 H300"/>
  <path class="arrow" d="M545 287 C590 270 590 205 630 193"/>
  <path class="arrow" d="M545 287 C590 305 590 395 630 403"/>
  <path class="arrow" d="M910 193 C965 210 960 260 1000 275"/>
  <path class="arrow" d="M910 403 C965 385 960 320 1000 300"/>
  <rect class="box" x="160" y="545" width="1080" height="58"/>
  <text class="small" x="700" y="580" text-anchor="middle">Purpose: initialize a smooth perturbation, suppress identity with recognition gradients, and evaluate transfer.</text>
</svg>
