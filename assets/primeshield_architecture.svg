<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#111827;stroke-width:2.2;rx:16}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2.2;rx:16}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;rx:16}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2.2;rx:16}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2.2;rx:16}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.2;rx:16}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#111827}.label{font:700 20px Arial,Helvetica,sans-serif;fill:#111827}.small{font:400 15px Arial,Helvetica,sans-serif;fill:#374151}.mono{font:700 15px Consolas,monospace;fill:#111827}.arrow{stroke:#111827;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
