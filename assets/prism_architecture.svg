  <text class="small" x="770" y="408" text-anchor="middle">top identity directions</text>
  <text class="mono" x="770" y="437" text-anchor="middle">guide P toward FR changes</text>
  <rect class="rose" x="1000" y="230" width="320" height="165"/>
  <text class="label" x="1160" y="270" text-anchor="middle">PRISM Objective</text>
  <text class="small" x="1160" y="303" text-anchor="middle">Riemannian privacy margin</text>
  <text class="small" x="1160" y="331" text-anchor="middle">utility and wavelet regularization</text>
  <text class="mono" x="1160" y="361" text-anchor="middle">compare with PrIdentity</text>
  <path class="arrow" d="M225 302 H300"/>
  <path class="arrow" d="M545 302 C590 285 590 205 625 193"/>
  <path class="arrow" d="M545 302 C590 320 590 400 625 408"/>
  <path class="arrow" d="M915 193 C970 210 960 285 1000 302"/>
  <path class="arrow" d="M915 408 C970 390 960 340 1000 325"/>
  <rect class="box" x="160" y="555" width="1080" height="58"/>
  <text class="small" x="700" y="590" text-anchor="middle">Purpose: optimize perturbations in frequency bands using embedding geometry and utility constraints.</text>
</svg>
