<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670">
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#111827;stroke-width:2.2;rx:16}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2.2;rx:16}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;rx:16}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2.2;rx:16}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2.2;rx:16}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#111827}.label{font:700 20px Arial,Helvetica,sans-serif;fill:#111827}.small{font:400 15px Arial,Helvetica,sans-serif;fill:#374151}.mono{font:700 15px Consolas,monospace;fill:#111827}.arrow{stroke:#111827;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#111827"/></marker>
  </defs>
  <rect class="bg" width="1400" height="670"/>
  <text class="title" x="700" y="58" text-anchor="middle">Approach 2 Architecture: PRISM</text>
  <rect class="box" x="55" y="250" width="170" height="105"/>
  <text class="label" x="140" y="290" text-anchor="middle">Input I</text>
  <text class="small" x="140" y="320" text-anchor="middle">LFW / CelebA-HQ</text>
  <rect class="green" x="300" y="190" width="245" height="225"/>
  <text class="label" x="422" y="230" text-anchor="middle">Wavelet Domain</text>
  <text class="small" x="422" y="263" text-anchor="middle">DWT decomposition</text>
  <text class="mono" x="422" y="292" text-anchor="middle">LL, LH, HL, HH</text>
  <text class="small" x="422" y="323" text-anchor="middle">per-band perturbation</text>
  <text class="mono" x="422" y="352" text-anchor="middle">p_s in [1,2]</text>
  <rect class="blue" x="625" y="120" width="290" height="145"/>
